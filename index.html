<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premodern Basel Property Dynamics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="header">
        <h2 style="margin: 0;">Basler Liegenschaften 1400-1700 Interaktiv</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
        <div id="search-container" style="display: flex; align-items: center; margin-left: 20px; position: relative; flex-grow: 1; max-width: 300px;">
            <input type="text" id="propertySearch" placeholder="Search ID or Address..." autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <div id="slider-container" style="margin-left: auto;">
            <label for="yearSlider">Active Year:</label>
            <input type="range" id="yearSlider" min="1400" max="1700" value="1450" step="1">
            <span id="yearDisplay">1450</span>
            
            
            <!-- NEW: <input type="checkbox" id="institutionToggle" checked style="cursor:pointer;"> -->
            <!-- <label for="institutionToggle" style="cursor:pointer; font-weight: bold;">Show Institutions</label> -->
        </div>
        <span style="margin: 0 15px; color: #ccc;">|</span>
        <button id="intro-toggle-btn" onclick="document.getElementById('intro-modal-overlay').style.display='flex'">Info</button>
        </div>
    </div>
    
    <div id="map-container">
        <div id="map"></div>
        
        <!-- NEW: The Expandable Bottom Panel for the Gantt Chart -->
        <div id="bottom-panel">
            <div id="panel-header">
                <span id="panel-title">Ownership Timeline</span>
                <span id="panel-close" onclick="window.closeBottomPanel()">&times;</span>
            </div>
            <div id="timeline-container">
                <!-- Timeline will be injected here by sidebar.js -->
            </div>
        </div>

        <div id="person-profile">
            <div id="profile-header">
                <span id="profile-name">Actor Name</span>
                <span id="profile-close" onclick="window.closeProfile()">&times;</span>
            </div>
            <div id="profile-content"></div>
        </div>

        <div id="sidebar">
            <h3 id="sidebar-title" style="margin-top:0;">Property Details</h3>
            <!-- Kept the tabs for now as requested -->
            <div id="sidebar-tabs" class="tabs" style="display: none;">
                <button id="tab-owners" class="tab-btn active" onclick="window.setSidebarView('owners')">Raw History</button>
                <button id="tab-docs" class="tab-btn" onclick="window.setSidebarView('docs')">Doc List</button>
            </div>
            <div id="sidebar-content">
                <p>Select a year using the slider, then click any dot or polygon on the map to view its ownership history.</p>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="window.closeModal(event)">
        <div id="modal-box" onclick="event.stopPropagation()">
            <div id="modal-header">
                <div id="modal-text-content"></div>
                <button class="close-btn" onclick="window.closeModal()">&times;</button>
            </div>
            <div id="image-viewer-area">
                <div id="zoom-hint">Scroll to Zoom | Drag to Pan</div>
                <button id="prev-btn" class="nav-btn" onclick="window.changeImage(-1)">&#10094;</button>
                <img id="viewer-img" src="" alt="Document Scan">
                <button id="next-btn" class="nav-btn" onclick="window.changeImage(1)">&#10095;</button>
                <div id="img-counter">1 / 1</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
